# Optional local PostgreSQL for development.
#   docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://realestate:realestate@localhost:5432/realestate?schema=public"
# If a native PostgreSQL is already listening on 5432, change the host port below (e.g. "5433:5432").
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
